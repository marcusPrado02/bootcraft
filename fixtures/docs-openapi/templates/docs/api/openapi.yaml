openapi: "3.1.0"

info:
  title: "{{projectName}}"
  description: "{{projectDescription}}"
  version: "0.1.0"
  contact:
    name: Engineering Team

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: health
    description: Liveness and readiness probes

paths:
  /health:
    get:
      summary: Liveness probe
      description: Returns 200 if the service process is running.
      operationId: getHealth
      tags: [health]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      summary: Readiness probe
      description: Returns 200 if the service is ready to accept traffic (dependencies up).
      operationId: getReady
      tags: [health]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok
        service:
          type: string
          example: "{{projectName}}"
        version:
          type: string
          example: "0.1.0"
        timestamp:
          type: string
          format: date-time
